site_name: "Volo's Guide to P&P"
site_description: "La wiki dei Permalosi & Polemici — Cronache, personaggi e lore della campagna"
site_url: "https://permalosietpolemici.github.io"
repo_url: "https://github.com/PermalosietPolemici/PermalosietPolemici.github.io"
repo_name: "PermalosietPolemici/PermalosietPolemici.github.io"

theme:
  name: material
  language: it
  palette:
    primary: deep purple
    accent: amber
  logo: assets/icons/logo-pp-square.png
  favicon: assets/icons/logo-pp-favicon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tooltips
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/twitch
      link: https://www.twitch.tv/permalosietpolemici
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@permalosietpolemici
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/permalosi_et_polemici
  generator: false

copyright: |
  &copy; 2026 Permalosi & Polemici — Campagna D&D 5e

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - roamlinks
  - glightbox
  - tags:
      tags_file: tags.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

nav:
  - "Volo's Guide to P&P": index.md
  - Chi Siamo: chi-siamo.md
  - Personaggi: pg/
  - Sessioni: sessioni/
  # - Missioni: missioni/
  - Lore: lore/
  - PNG: png/
  - Fazioni: fazioni/
  - Tag: tags.md

extra_css:
  - assets/stylesheets/extra.css